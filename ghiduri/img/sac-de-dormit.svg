<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
<style>text{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#26231F;font-size:23px}.b{font-weight:600}.m{fill:#7C746A}</style>
<rect width="640" height="400" fill="#FFFFFF"/>
<!-- sleeveless sleep sack, front view -->
<path d="M300 40Q320 60 340 40L390 46Q352 100 406 136L432 300Q436 352 320 356Q204 352 208 300L234 136Q288 100 250 46Z" fill="#E4EBE3" stroke="#8FA996" stroke-width="3" stroke-linejoin="round"/>
<!-- zip with a guard under the chin -->
<line x1="320" y1="70" x2="320" y2="300" stroke="#8FA996" stroke-width="4" stroke-dasharray="6 4"/>
<rect x="311" y="54" width="18" height="16" rx="4" fill="#2E6F79"/>
<rect x="314" y="296" width="12" height="18" rx="3" fill="#2E6F79"/>
<!-- room for the legs -->
<line x1="232" y1="318" x2="408" y2="318" stroke="#B45B3F" stroke-width="3"/>
<path d="M224 318l12-7v14zM416 318l-12-7v14z" fill="#B45B3F"/>
<!-- callouts -->
<g stroke="#7C746A" stroke-width="1.5" fill="none"><path d="M196 52H296"/><path d="M444 96H384"/><path d="M444 190L330 66"/></g>
<text x="20" y="46" class="b">Gât pe măsură:</text><text x="20" y="74" class="m">capul nu alunecă</text><text x="20" y="99" class="m">înăuntru</text>
<text x="452" y="92" class="b">Fără mâneci,</text><text x="452" y="116" class="b">fără glugă</text>
<text x="452" y="196" class="b">Fermoar cu</text><text x="452" y="222" class="m">protecție</text><text x="452" y="246" class="m">la bărbie</text>
<text x="320" y="390" text-anchor="middle" class="b" style="fill:#B45B3F">Loc să-și miște picioarele</text>
</svg>
