<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340">
<style>text{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#26231F;font-size:25px}.b{font-weight:600}.m{fill:#7C746A;font-size:22px}.c{fill:#B45B3F;font-weight:600}.t{fill:#2E6F79;font-weight:600}</style>
<rect width="640" height="340" fill="#FFFFFF"/>
<!-- boot seen from above: rear bench at the top, opening at the bottom, wheel arches on the sides -->
<rect x="110" y="24" width="420" height="44" rx="10" fill="#E7E0D5"/>
<text x="320" y="53" text-anchor="middle" class="m">bancheta din spate</text>
<rect x="110" y="72" width="420" height="216" fill="#F3EEE5"/>
<rect x="110" y="150" width="62" height="92" rx="14" fill="#D8CFC2"/>
<rect x="468" y="150" width="62" height="92" rx="14" fill="#D8CFC2"/>
<rect x="100" y="288" width="440" height="14" rx="5" fill="#D8CFC2"/>
<text x="320" y="330" text-anchor="middle" class="m">marginea portbagajului</text>
<!-- narrowest width, between the wheel arches -->
<line x1="182" y1="196" x2="458" y2="196" stroke="#B45B3F" stroke-width="3"/>
<path d="M174 196l12-7v14zM466 196l-12-7v14z" fill="#B45B3F"/>
<rect x="226" y="204" width="188" height="32" fill="#F3EEE5"/>
<text x="320" y="228" text-anchor="middle" class="c">lățime minimă</text>
<!-- depth, from the bench to the lip -->
<line x1="320" y1="82" x2="320" y2="184" stroke="#2E6F79" stroke-width="3"/>
<line x1="320" y1="240" x2="320" y2="278" stroke="#2E6F79" stroke-width="3"/>
<path d="M320 74l-7 12h14zM320 286l-7-12h14z" fill="#2E6F79"/>
<rect x="330" y="106" width="130" height="34" fill="#F3EEE5"/>
<text x="336" y="131" class="t">adâncime</text>
</svg>
