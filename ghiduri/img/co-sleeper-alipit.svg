<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<style>text{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#26231F;font-size:19px}.b{font-weight:600}.c{fill:#B45B3F;font-weight:600}</style>
<rect width="400" height="300" fill="#FFFFFF"/>
<line x1="10" y1="276" x2="390" y2="276" stroke="#E7E0D5" stroke-width="3"/>
<!-- parents' bed, cut across: mattress on a frame -->
<rect x="10" y="148" width="210" height="44" rx="6" fill="#F3EEE5" stroke="#D8CFC2" stroke-width="2"/>
<rect x="10" y="192" width="210" height="18" rx="3" fill="#C9B79C"/>
<rect x="12" y="210" width="12" height="62" fill="#C9B79C"/><rect x="206" y="210" width="12" height="62" fill="#C9B79C"/>
<!-- co-sleeper with the side toward the bed lowered -->
<rect x="234" y="148" width="136" height="18" rx="4" fill="#E4EBE3" stroke="#8FA996" stroke-width="2"/>
<rect x="228" y="166" width="148" height="10" rx="3" fill="#B08D62"/>
<rect x="362" y="70" width="12" height="106" rx="4" fill="#B08D62"/>
<rect x="240" y="176" width="10" height="84" fill="#B08D62"/><rect x="354" y="176" width="10" height="84" fill="#B08D62"/>
<circle cx="245" cy="264" r="10" fill="#7C746A"/><circle cx="359" cy="264" r="10" fill="#7C746A"/>
<rect x="224" y="146" width="10" height="30" rx="3" fill="#B08D62"/>
<!-- strap under the parents' mattress -->
<path d="M236 174L224 196H22" fill="none" stroke="#B45B3F" stroke-width="4" stroke-dasharray="10 6"/>
<!-- same level -->
<path d="M10 140H374" stroke="#B45B3F" stroke-width="2" stroke-dasharray="4 5"/>
<text x="16" y="126" class="c">saltele la același nivel</text>
<text x="115" y="246" text-anchor="middle" class="c">chingă de prindere</text>
