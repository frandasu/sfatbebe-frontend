<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<style>text{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#7C746A;font-size:19px}.k{fill:#26231F;font-weight:600}</style>
<rect width="400" height="300" fill="#FFFFFF"/>
<!-- direction of travel -->
<text x="238" y="38" text-anchor="end">sensul de mers</text>
<line x1="250" y1="32" x2="352" y2="32" stroke="#7C746A" stroke-width="3"/><path d="M362 32l-14-8v16z" fill="#7C746A"/>
<!-- rear bench of the car -->
<rect x="58" y="58" width="34" height="22" rx="7" fill="#E7E0D5"/>
<path d="M66 86h30l14 132H80z" fill="#E7E0D5"/>
<rect x="80" y="214" width="250" height="34" rx="10" fill="#E7E0D5"/>
<line x1="20" y1="284" x2="380" y2="284" stroke="#E7E0D5" stroke-width="3"/>
<!-- rear-facing shell, faded: the point is how the base attaches -->
<path d="M160 184h62l92-96" fill="none" stroke="#2E6F79" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity=".3"/>
<!-- base: ISOFIX arm into the anchor at the seat bight, support leg to the floor -->
<rect x="122" y="196" width="232" height="18" rx="5" fill="#245861"/>
<line x1="126" y1="208" x2="104" y2="212" stroke="#245861" stroke-width="8" stroke-linecap="round"/>
<rect x="94" y="206" width="14" height="12" rx="3" fill="#B45B3F"/>
<rect x="340" y="206" width="10" height="72" rx="3" fill="#245861"/>
<rect x="330" y="274" width="30" height="8" rx="3" fill="#245861"/>
<!-- labels -->
<line x1="101" y1="224" x2="101" y2="254" stroke="#7C746A" stroke-width="1.5"/>
<text x="101" y="276" text-anchor="middle" class="k">ISOFIX</text>
<text x="322" y="276" text-anchor="end" class="k">picior de sprijin</text>
</svg>
