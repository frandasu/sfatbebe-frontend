<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340">
<style>text{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#26231F;font-size:24px}.b{font-weight:600}.m{fill:#7C746A}.c{fill:#B45B3F;font-weight:600}</style>
<rect width="640" height="340" fill="#FFFFFF"/>
<!-- crib seen from above: wooden frame, empty mattress with a fitted sheet -->
<rect x="50" y="66" width="448" height="232" rx="10" fill="#E9D9C1"/>
<rect x="58" y="74" width="432" height="216" rx="4" fill="#FAF7F2"/>
<rect x="58" y="74" width="426" height="216" rx="4" fill="#E4EBE3"/>
<text x="271" y="190" text-anchor="middle" class="m">saltea fermă, plată, pe măsură</text>
<!-- the gap check at the side -->
<rect x="484" y="150" width="6" height="64" fill="#B45B3F"/>
<line x1="498" y1="182" x2="526" y2="182" stroke="#B45B3F" stroke-width="2"/>
<text x="534" y="172" class="c">max.</text>
<text x="534" y="198" class="c">2 degete</text>
