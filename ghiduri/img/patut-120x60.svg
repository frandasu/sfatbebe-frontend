<line x1="58" y1="40" x2="490" y2="40" stroke="#7C746A" stroke-width="1.5"/>
<line x1="58" y1="32" x2="58" y2="48" stroke="#7C746A" stroke-width="1.5"/><line x1="490" y1="32" x2="490" y2="48" stroke="#7C746A" stroke-width="1.5"/>
<rect x="228" y="26" width="88" height="28" fill="#FFFFFF"/>
<text x="272" y="48" text-anchor="middle" class="b">120 cm</text>
<line x1="26" y1="74" x2="26" y2="290" stroke="#7C746A" stroke-width="1.5"/>
<line x1="18" y1="74" x2="34" y2="74" stroke="#7C746A" stroke-width="1.5"/><line x1="18" y1="290" x2="34" y2="290" stroke="#7C746A" stroke-width="1.5"/>
<rect x="10" y="146" width="32" height="72" fill="#FFFFFF"/>
<text x="26" y="182" text-anchor="middle" class="b" transform="rotate(-90 26 182)" dy="7">60 cm</text>
