<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
<style>text{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;fill:#26231F;font-size:24px}.b{font-weight:600}.m{fill:#7C746A}.t{font-size:21px;fill:#7C746A}</style>
