<rect x="574" y="170" width="52" height="58" rx="10" fill="#8FA996"/>
<g text-anchor="middle"><text x="80" y="262" class="b">Tip carte</text><text x="240" y="262" class="b">Automată</text><text x="400" y="262" class="b">Umbrelă</text><text x="556" y="262" class="b">În două părți</text>
